name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android/OpenU60/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "mobile/android/OpenU60/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/OpenU60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenU60-debug-apk
          path: mobile/android/OpenU60/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
