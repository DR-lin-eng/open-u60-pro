name: Android And Agent Release

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android/OpenU60/**"
      - "zte-agent/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "mobile/android/OpenU60/**"
      - "zte-agent/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
      agent_name: ${{ steps.meta.outputs.agent_name }}
      android_artifact: ${{ steps.meta.outputs.android_artifact }}
      rust_artifact: ${{ steps.meta.outputs.rust_artifact }}

    steps:
      - name: Compute version metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.pull_request.number }}.${GITHUB_RUN_NUMBER}"
            TAG="pr-${{ github.event.pull_request.number }}-run-${GITHUB_RUN_NUMBER}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
            TAG="v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=OpenU60-${VERSION}-debug.apk" >> "$GITHUB_OUTPUT"
          echo "agent_name=zte-agent-${VERSION}-aarch64-unknown-linux-musl" >> "$GITHUB_OUTPUT"
          echo "android_artifact=android-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "rust_artifact=rust-${VERSION}" >> "$GITHUB_OUTPUT"

  build-android:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: mobile/android/OpenU60
        run: >
          gradle :app:assembleDebug
          -PciVersionCode=${{ github.run_number }}
          -PciVersionName=${{ needs.version.outputs.version }}
          --stacktrace

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p dist
          cp mobile/android/OpenU60/app/build/outputs/apk/debug/app-debug.apk "dist/${{ needs.version.outputs.apk_name }}"
          ls -lh dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.android_artifact }}
          path: dist/${{ needs.version.outputs.apk_name }}
          if-no-files-found: error

  build-rust:
    runs-on: ubuntu-latest
    needs: version
    container:
      image: messense/rust-musl-cross:aarch64-musl
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: /usr/bin/aarch64-linux-gnu-gcc-11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build zte-agent (aarch64 musl)
        run: cargo build --release --target aarch64-unknown-linux-musl -p zte-agent

      - name: Collect Rust asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/zte-agent "dist/${{ needs.version.outputs.agent_name }}"
          ls -lh dist

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.rust_artifact }}
          path: dist/${{ needs.version.outputs.agent_name }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - version
      - build-android
      - build-rust
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.android_artifact }}
          path: dist

      - name: Download Rust artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.rust_artifact }}
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum "dist/${{ needs.version.outputs.apk_name }}" "dist/${{ needs.version.outputs.agent_name }}" > "dist/SHA256SUMS.txt"
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OpenU60 ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/${{ needs.version.outputs.apk_name }}
            dist/${{ needs.version.outputs.agent_name }}
            dist/SHA256SUMS.txt
